# Warns when the files shared with the time-off site (styles.css, api.js, fonts) differ from that site's copies.
# Both sites must look and sign in the same way, so change these files in both repositories together.
name: Shared files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: USC-Transplant-Surgery-Fellowship/timeoff
          path: other-site
      - name: Compare shared files with the time-off site
        run: |
          status=0
          for f in assets/styles.css assets/api.js assets/fonts/doto.woff2 assets/fonts/atkinson-hyperlegible-next.woff2; do
            if ! cmp -s "$f" "other-site/$f"; then
              echo "::warning file=$f::$f differs from the time-off site's copy. Make the same change in both repositories."
              status=1
            fi
          done
          [ $status -eq 0 ] && echo "Shared files match the time-off site."
          exit 0
