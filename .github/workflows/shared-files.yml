# Fails when the files shared by the three sites (styles.css, ui.js, api.js, fonts) differ from the time-off site's
# copies (from a branch with the same name if the time-off repository has one, else its main). The sites must look and
# sign in the same way, so change these files in all three repositories together. The server repository checks this
# too, with the rest of the settings the repositories share (tools/check_settings.js).
name: Shared files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the time-off site (the same branch name if it has it, else main)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/USC-Transplant-Surgery-Fellowship/timeoff.git
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then ref="$BRANCH"; fi
          git clone --quiet --depth 1 --branch "$ref" "$url" other-site
      - name: Compare shared files with the time-off site
        run: |
          status=0
          for f in assets/styles.css assets/ui.js assets/api.js assets/fonts/doto.woff2 assets/fonts/atkinson-hyperlegible-next.woff2; do
            if ! cmp -s "$f" "other-site/$f"; then
              echo "::error file=$f::$f differs from the time-off site's copy. Make the same change in all three repositories."
              status=1
            fi
          done
          [ $status -eq 0 ] && echo "Shared files match the time-off site."
          exit $status
